<!-- CONTROL DE ACCESO CON SWITCH -->
<div class="access-control premium">
    <div class="access-toggle premium">
        <div class="access-info">
            <span class="access-label"><i class="fas fa-lock"></i> Estado del Sistema:</span>
            <span class="access-status" id="accessStatus">
                <i class="fas fa-circle"></i> ACTIVO
            </span>
        </div>
        <label class="switch premium">
            <input type="checkbox" id="formAccessToggle" onchange="toggleFormAccess()" checked>
            <span class="slider round"></span>
        </label>
    </div>
    <p class="access-help"><i class="fas fa-info-circle"></i> Cuando está desactivado, los docentes no podrán registrar asistencia</p>
</div>
